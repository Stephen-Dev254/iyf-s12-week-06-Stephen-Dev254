<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6: Async Practice</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; line-height: 1.5; }
        .hidden { display: none; }
        .section-box { border: 1px solid #cbd5e1; padding: 20px; margin-bottom: 24px; border-radius: 8px; background: #ffffff; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #94a3b8; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
        .controls input, .controls select { padding: 8px; border: 1px solid #94a3b8; border-radius: 4px; flex: 1; min-width: 180px; }
        .user-card, .post-result { border: 1px solid #cbd5e1; padding: 15px; margin: 12px 0; border-radius: 8px; background: #f8fafc; }
        .post-result { border-left: 4px solid #16a34a; background: #f0fdf4; }
        .user-card h2, .post-result h3 { margin: 0 0 8px 0; color: #1e293b; }
        .user-card p, .post-result p { margin: 4px 0; color: #475569; }
        #error { color: #dc2626; font-weight: bold; padding: 10px; background: #fee2e2; border-radius: 6px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <!-- Task 12.3: POST Request Form -->
    <div class="section-box">
        <h2>Task 12.3: Create a New Post</h2>
        <form id="post-form">
            <div class="form-group">
                <label for="post-title">Post Title</label>
                <input type="text" id="post-title" placeholder="Enter post title" required>
            </div>
            <div class="form-group">
                <label for="post-body">Post Content</label>
                <textarea id="post-body" rows="3" placeholder="Write your post content..." required></textarea>
            </div>
            <button type="submit">Publish Post</button>
        </form>
        <div id="post-result" class="hidden"></div>
    </div>

    <!-- Task 12.2 & 12.4: User Directory with Search, Sort & Filter -->
    <div id="app" class="section-box">
        <h1>User Directory</h1>
        
        <div class="controls">
            <input type="text" id="search" placeholder="Search by name or email...">
            <select id="sort-select">
                <option value="default">Sort: Default</option>
                <option value="asc">Name: A to Z</option>
                <option value="desc">Name: Z to A</option>
            </select>
            <select id="city-filter">
                <option value="all">All Cities</option>
            </select>
        </div>

        <div id="loading">Loading...</div>
        <div id="error" class="hidden"></div>
        <div id="users-container"></div>
    </div>

    <script src="async.js"></script>
</body>
</html>
